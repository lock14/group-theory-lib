name: Feature request
description: Propose a new algebraic structure, algorithm, or performance improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Feature category
      options:
        - "Exact algebraic structure or construction"
        - "Linear algebra decomposition or algorithm"
        - "Numerical or off-heap FFM operation (lock14.algebra.numeric)"
        - "Performance or allocation optimization"
        - "Documentation or examples"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Mathematical or engineering limitation this proposal addresses.
      placeholder: Describe the mathematical problem or use case...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API and implementation details
      description: Proposed interfaces, types, factory methods, and exact or numerical package placement.
      render: java
      placeholder: |
        // Example proposed API usage
    validations:
      required: true

  - type: textarea
    id: complexity
    attributes:
      label: Algebraic laws and complexity characteristics
      description: Applicable `jqwik` `*Laws` interfaces, expected time and space complexity, and allocation profile.
      placeholder: |
        - Implements CommutativeRing<T> (CommutativeRingLaws)
        - Multiplication: O(n^2) field operations
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Mathematical references and alternatives considered
      description: Textbook references, papers, or alternative designs evaluated.
    validations:
      required: false
