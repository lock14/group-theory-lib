name: 💡 Feature / Algebraic Structure Request
description: Propose a new algebraic structure, algorithm, or performance improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new mathematical structure, number system, or optimization? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Motivation / Use Case
      description: What mathematical structure or capability would you like to see added?
      placeholder: E.g., Adding Clifford Algebras / Lie Algebras / Galois Fields...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe the mathematical properties, proposed interfaces, or design details.
      placeholder: |
        ```java
        // Example proposed usage
        ```
      render: java
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Mathematical References / Alternatives Considered
      description: List any papers, textbook references, or existing work in other CAS libraries.
