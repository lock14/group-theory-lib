name: 💡 Feature / Algebraic Structure Request
description: Propose a new algebraic structure, algorithm, or performance improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new mathematical structure, universal construction, or optimization? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What mathematical structure or capability would you like to see added?
      placeholder: E.g., Adding Clifford Algebras / Lie Algebras / Groebner Bases / Sparse Matrices...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe the proposed interfaces, types, factory methods, and exact vs. numeric placement.
      placeholder: |
        ```java
        // Example proposed API usage
        ```
      render: java
    validations:
      required: true

  - type: textarea
    id: complexity
    attributes:
      label: Algebraic Laws & Complexity Characteristics
      description: Describe which algebraic `*Laws` apply, expected time/space complexity, and allocation profile.
      placeholder: |
        - Implements `CommutativeRing<T>` (`CommutativeRingLaws`)
        - Multiplication: O(n^2) field operations
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Mathematical References / Alternatives Considered
      description: List any papers, textbook references, or existing designs in other CAS libraries.
    validations:
      required: false
