name: 🐛 Bug Report
description: Report a bug, incorrect algebraic calculation, or unexpected exception
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in `group-theory-lib`! Please provide as much detail as possible to help us reproduce and resolve the problem.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Provide a short, self-contained Java 25 snippet that reproduces the issue.
      placeholder: |
        ```java
        import lock14.algebra.numbers.*;

        Rational a = Rational.of(1, 2);
        // ...
        ```
      render: java
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What mathematical result or behavior did you expect?
      placeholder: Explain what behavior was expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Output
      description: What actually happened? Include exception messages or stack traces if applicable.
      placeholder: |
        lock14.algebra.exceptions.NonInvertibleElementException: ...
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: Output of `java --version`
      placeholder: e.g. openjdk 25 2025-09-16 LTS
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating System & Architecture
      description: OS and Architecture (e.g. Linux amd64, macOS aarch64, Windows amd64)
      placeholder: e.g. Linux amd64
    validations:
      required: true
