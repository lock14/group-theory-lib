name: 🐛 Bug Report
description: Report a bug, incorrect algebraic calculation, or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in `group-theory-lib`!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code
      description: Provide a minimal code snippet reproducing the problem.
      placeholder: |
        ```java
        Rational a = Rational.of(1, 2);
        // ...
        ```
      render: java
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen vs what actually happened?
    validations:
      required: true
  - type: dropdown
    id: java-version
    attributes:
      label: Java Version
      description: Which JDK version are you using?
      options:
        - JDK 25 LTS
        - JDK 26+ (Early Access)
        - Other (please specify in description)
    validations:
      required: true
