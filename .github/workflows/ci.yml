name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel redundant in-flight workflow runs on pull requests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hygiene-and-lint:
    name: Hygiene, Checkstyle & Javadoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run Enforcer, Checkstyle, Strict Compiler & Javadoc
        run: ./mvnw --batch-mode --no-transfer-progress clean validate test-compile javadoc:javadoc

  build-and-test:
    name: Test (Java ${{ matrix.java-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java-version: ['25']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Make Maven Wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./mvnw

      - name: Run Maven Test Suite
        run: ./mvnw --batch-mode --no-transfer-progress clean test

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  # =========================================================================
  # Gatekeeper Pattern:
  # Aggregates all hygiene/lint and OS matrix jobs into a single required
  # status check for branch protection rules.
  # =========================================================================
  gatekeeper:
    name: CI Gatekeeper
    if: always()
    needs:
      - hygiene-and-lint
      - build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Evaluate CI matrix status
        run: |
          echo "Hygiene & Lint: ${{ needs.hygiene-and-lint.result }}"
          echo "Test Matrix:    ${{ needs.build-and-test.result }}"
          if [ "${{ needs.hygiene-and-lint.result }}" != "success" ] || \
             [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "::error::One or more prerequisite CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI checks passed successfully!"

      # Runs seamlessly inside Gatekeeper ONLY for Dependabot PRs (no extra checks in UI for humans)
      - name: Auto-Merge Dependabot PR
        if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
